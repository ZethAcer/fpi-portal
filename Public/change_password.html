<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - FPI IT Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 font-sans text-slate-800 antialiased flex items-center justify-center min-h-screen p-4">

    <!-- CHANGE PASSWORD CARD CONTAINER -->
    <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl border border-slate-800 overflow-hidden">
        
        <!-- HEADER / BRANDING -->
        <div class="bg-slate-950 p-6 border-b border-slate-800 text-center">
            <img src="logo.png" alt="Fabricator Philippines Incorporated" class="h-10 mx-auto object-contain mb-2">
            <h1 class="text-white font-bold text-lg tracking-wide">IT Department Internal Portal</h1>
            <p class="text-xs text-slate-400 mt-1">Batino Branch | Password Update</p>
        </div>

        <!-- FORM CONTENT -->
        <div class="p-6 sm:p-8">
            <div class="flex items-center space-x-3 mb-6 pb-3 border-b border-slate-100">
                <div class="w-10 h-10 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center font-bold text-lg">
                    <i class="fa-solid fa-key"></i>
                </div>
                <div>
                    <h2 class="text-slate-800 font-bold text-base">Change Password</h2>
                    <p class="text-xs text-slate-500">Logged in as: <span id="current-user-display" class="font-semibold text-slate-700">Loading...</span></p>
                </div>
            </div>

            <!-- ALERT MESSAGE CONTAINER -->
            <div id="alert-box" class="hidden mb-4 p-3 rounded-lg text-xs font-medium border text-center"></div>

            <form id="change_password-form" class="space-y-4">
                <!-- Current Password -->
                <div>
                    <label for="current-password" class="block text-xs font-semibold text-slate-700 uppercase mb-1">Current Password</label>
                    <div class="relative">
                        <input type="password" id="current-password" required placeholder="••••••••" 
                            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                    </div>
                </div>

                <!-- New Password -->
                <div>
                    <label for="new-password" class="block text-xs font-semibold text-slate-700 uppercase mb-1">New Password</label>
                    <div class="relative">
                        <input type="password" id="new-password" required placeholder="Minimum 6 characters" 
                            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                    </div>
                </div>

                <!-- Confirm New Password -->
                <div>
                    <label for="confirm-password" class="block text-xs font-semibold text-slate-700 uppercase mb-1">Confirm New Password</label>
                    <div class="relative">
                        <input type="password" id="confirm-password" required placeholder="Re-type new password" 
                            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                    </div>
                </div>

                <!-- SUBMIT AND CANCEL BUTTONS -->
                <div class="pt-2 space-y-2">
                    <button type="submit" id="submit-btn" 
                        class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm rounded-lg shadow-md transition flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-floppy-disk"></i>
                        <span>Update Password</span>
                    </button>
                    
                    <a href="dashboard.html" 
                        class="w-full py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-sm rounded-lg transition flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-arrow-left"></i>
                        <span>Back to Dashboard</span>
                    </a>
                </div>
            </form>
        </div>

        <!-- FOOTER -->
        <div class="bg-slate-50 p-4 border-t border-slate-100 text-center text-[11px] text-slate-400">
            FPI IT Security Policy Enforcement • Laguna Branch
        </div>
    </div>

    <!-- CLIENT-SIDE SCRIPT -->
    <script>
        let loggedUser = null;

        // Check user session on page load
        window.addEventListener('DOMContentLoaded', () => {
            const userData = localStorage.getItem('portal_users');
            
            if (!userData) {
                // Kick back to login if no active session exists
                window.location.href = "index.html";
                return;
            }

            loggedUser = JSON.parse(userData);
            document.getElementById('current-user-display').textContent = loggedUser.username;
        });

        // Form Submission Logic
        document.getElementById('change_password-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const currentPassword = document.getElementById('current-password').value;
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            const alertBox = document.getElementById('alert-box');
            const submitBtn = document.getElementById('submit-btn');

            // Client-side validations
            if (newPassword.length < 6) {
                showAlert('New password must be at least 6 characters long.', 'error');
                return;
            }

            if (newPassword !== confirmPassword) {
                showAlert('New password and confirmation do not match.', 'error');
                return;
            }

            if (currentPassword === newPassword) {
                showAlert('New password must be different from your current password.', 'error');
                return;
            }

            // Disable submit button during request
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-50', 'cursor-not-allowed');

            try {
                const response = await fetch('/api/change_password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: loggedUser.username,
                        currentPassword: currentPassword,
                        newPassword: newPassword
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showAlert('Password updated successfully! Redirecting to dashboard...', 'success');
                    
                    // Reset form fields
                    document.getElementById('change_password-form').reset();

                    // Redirect after 1.5 seconds
                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 1500);
                } else {
                    showAlert(data.message || 'Failed to change password.', 'error');
                }

            } catch (err) {
                console.error('Password change error:', err);
                showAlert('Unable to reach server. Please check your network or server process.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        });

        function showAlert(message, type) {
            const alertBox = document.getElementById('alert-box');
            alertBox.classList.remove('hidden', 'bg-rose-100', 'text-rose-700', 'border-rose-300', 'bg-emerald-100', 'text-emerald-700', 'border-emerald-300');

            if (type === 'error') {
                alertBox.classList.add('bg-rose-100', 'text-rose-700', 'border-rose-300');
            } else {
                alertBox.classList.add('bg-emerald-100', 'text-emerald-700', 'border-emerald-300');
            }

            alertBox.textContent = message;
        }
    </script>
</body>
</html>
