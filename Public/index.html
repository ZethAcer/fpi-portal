<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPI Batino Branch - IT Portal Login</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <!-- Tailwind CSS for modern, responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md border border-slate-700">
        <!-- Logo & Header -->
        <div class="text-center mb-6">
            <img src="logo.png" alt="FPI Logo" class="mx-auto h-16 w-auto mb-3 object-contain" onerror="this.style.display='none'">
            <h1 class="text-2xl font-bold text-slate-800">IT Department Portal</h1>
            <p class="text-sm text-slate-500">Fabricator Philippines Inc. - Batino Branch</p>
        </div>

        <!-- Alert Message Box -->
        <div id="alert-box" class="hidden mb-4 p-3 rounded text-sm font-medium text-center"></div>

        <!-- Login Form -->
        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
                <input type="text" id="username" required 
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Enter your username">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <input type="password" id="password" required 
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Enter your password">
            </div>

            <button type="submit" id="submit-btn" 
                class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition duration-200">
                Log In
            </button>
        </form>

        <!-- Attempt Counter Tracker -->
        <div class="mt-4 text-center text-xs text-slate-400">
            Attempts remaining: <span id="attempts-left" class="font-bold text-slate-600">3</span>/3
        </div>

        <!-- Footer Note -->
        <div class="mt-6 text-center text-xs text-slate-400 border-t border-slate-200 pt-4">
            © 2026 Fabricator Philippines Inc. Internal Systems (Beta).
        </div>
    </div>

    <!-- Login Logic Script -->
    <script>
        // Check if user is already logged in on page load and redirect to dashboard
        document.addEventListener("DOMContentLoaded", () => {
            const isLoggedIn = localStorage.getItem("portal_users");
            if (isLoggedIn) {
                window.location.href = "dashboard.html";
            }
        });

        let attemptsLeft = 3;

        async function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('alert-box');

            // Reset alert box
            alertBox.classList.add('hidden');
            alertBox.textContent = '';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const result = await response.json();

                if (response.ok && result.success) {
                    const role = result.user.role;

                    // Enforce Rule: 'User' cannot log in to the portal and has no privileges
                    if (role === 'User') {
                        alertBox.className = "mb-4 p-3 rounded text-sm font-medium text-center bg-red-100 text-red-700";
                        alertBox.textContent = "You don't have permission to Access this Page";
                        alertBox.classList.remove('hidden');
                        return;
                    }

                    // Save user session in localStorage for auth sync
                    localStorage.setItem('portal_users', JSON.stringify(result.user));

                    // Direct all authenticated administrative/operational roles to the dashboard overview
                    window.location.href = 'dashboard.html';
                } else {
                    handleFailedAttempt(result.message || 'Invalid username or password.');
                }
            } catch (err) {
                console.error('Login error:', err);
                alertBox.className = "mb-4 p-3 rounded text-sm font-medium text-center bg-red-100 text-red-700";
                alertBox.textContent = 'Server connection error during login.';
                alertBox.classList.remove('hidden');
            }
        }

        function handleFailedAttempt(errorMessage) {
            const alertBox = document.getElementById('alert-box');
            const submitBtn = document.getElementById('submit-btn');
            const attemptsDisplay = document.getElementById('attempts-left');

            attemptsLeft--;
            attemptsDisplay.textContent = attemptsLeft;

            if (attemptsLeft > 0) {
                alertBox.className = "mb-4 p-3 rounded text-sm font-medium text-center bg-red-100 text-red-700";
                alertBox.textContent = `${errorMessage} You have ${attemptsLeft} attempt(s) remaining.`;
                alertBox.classList.remove('hidden');
            } else {
                alertBox.className = "mb-4 p-3 rounded text-sm font-medium text-center bg-red-200 text-red-800";
                alertBox.textContent = "Access Locked: Too many failed login attempts. Please contact IT Support.";
                alertBox.classList.remove('hidden');

                document.getElementById('username').disabled = true;
                document.getElementById('password').disabled = true;
                submitBtn.disabled = true;
                submitBtn.classList.add('bg-slate-400', 'cursor-not-allowed');
                submitBtn.classList.remove('hover:bg-blue-700', 'bg-blue-600');
            }
        }
    </script>
</body>
</html>
